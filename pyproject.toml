[project]
name = "rag-reference"
version = "0.1.0"
description = "Framework- and domain-agnostic RAG reference implementation."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "anthropic>=0.100.0",
    "beir>=2.2.0",
    "ipykernel>=7.3.0",
    "langchain-openai>=1.2.1",
    "pypdf>=6.11.0",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[dependency-groups]
core = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]
openai = [
    "openai>=1.40",
]
anthropic = [
    "anthropic>=0.30",
]
cortex = [
    "snowflake-snowpark-python>=1.18",
    "snowflake-connector-python>=3.7",
]
chroma = [
    "chromadb>=0.5",
]
pgvector = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
]
cohere = [
    "cohere>=5.5",
]
ragas = [
    "ragas>=0.2",
    "datasets>=2.18",
    "langchain-openai>=0.1",
]
ui = [
    "streamlit>=1.35",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
